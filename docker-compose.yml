name: projet-ia-ecole

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Pour utiliser le GPU NVIDIA, décommentez :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # n8n:
  #   image: n8nio/n8n:latest
  #   restart: unless-stopped
  #   environment:
  #     N8N_HOST: localhost
  #     N8N_PORT: 5678
  #     WEBHOOK_URL: http://localhost:5678/
  #     GENERIC_TIMEZONE: ${TZ}
  #     TZ: ${TZ}
  #   volumes:
  #     - n8n_data:/home/node/.n8n
  #   ports:
  #     - "5678:5678"
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: operable-brook-tipped.ngrok-free.dev
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://operable-brook-tipped.ngrok-free.dev/
      N8N_EDITOR_BASE_URL: https://operable-brook-tipped.ngrok-free.dev/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  whatsapp-bot:
    build: ./whatsapp-bot
    restart: unless-stopped
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://n8n:5678/webhook/whatsapp
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances

  ia-agent:
    build: ./ia-agent
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      N8N_NOTIFY_URL: http://n8n:5678/webhook/notify-professor
      PROFESSOR_EMAIL: ${PROFESSOR_EMAIL}
      PROFESSOR_PHONES: ${PROFESSOR_PHONES}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
  evolution_instances:
